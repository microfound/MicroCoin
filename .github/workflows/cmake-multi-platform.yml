name: Build Microcoin-Qt

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install Qt 5
      uses: jurplel/install-qt-action@v3
      with:
        version: 5.15.2
        host: linux
        target: desktop
        modules: qtcharts

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          libdb++-dev \
          libboost-all-dev \
          libminiupnpc-dev \
          libqrencode-dev \
          libprotobuf-dev protobuf-compiler \
          libevent-dev \
          pkg-config \
          automake \
          libtool \
          git
          
     - name: Install OpenSSL 1.1
       run: |
         sudo apt-get update
         sudo apt-get install -y libssl1.1 || true
         wget http://security.ubuntu.com/ubuntu/pool/main/o/openssl1.1/libssl1.1_1.1.1f-1ubuntu2.22_amd64.deb
         sudo dpkg -i libssl1.1_1.1.1f-1ubuntu2.22_amd64.deb
     - name: setpath
       run: |
            export OPENSSL_LIB_PATH=/usr/lib/x86_64-linux-gnu \
            export OPENSSL_INCLUDE_PATH=/usr/include/openssl

    - name: Build LevelDB (as required by your .pro)
      run: |
        cd src/leveldb
        make libleveldb.a libmemenv.a

    - name: Run qmake
      run: |
        qmake microcoin-qt.pro OPENSSL_LIB_PATH=/usr/lib/x86_64-linux-gnu OPENSSL_INCLUDE_PATH=/usr/include/openssl
    - name: Build project
      run: |
        make -j$(nproc)

    - name: Upload Microcoin-Qt binary
      uses: actions/upload-artifact@v4
      with:
        name: microcoin-qt
        path: microcoin-qt
