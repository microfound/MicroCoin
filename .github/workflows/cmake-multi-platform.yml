name: Build Microcoin-Qt

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ============================
  # LINUX x86_64 BUILD
  # ============================
  linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install Qt 5
      uses: jurplel/install-qt-action@v3
      with:
        version: 5.15.2
        host: linux
        target: desktop
        modules: qtcharts

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          libdb++-dev \
          libboost-all-dev \
          libminiupnpc-dev \
          libqrencode-dev \
          libprotobuf-dev protobuf-compiler \
          libevent-dev \
          pkg-config \
          automake \
          libtool \
          git \
          curl

    - name: Install OpenSSL 1.1.1u (Linux)
      run: |
        curl -O https://www.openssl.org/source/openssl-1.1.1u.tar.gz
        tar -xzf openssl-1.1.1u.tar.gz
        cd openssl-1.1.1u
        ./config no-shared --prefix=/usr/local/openssl-1.1
        make -j$(nproc)
        sudo make install_sw

    - name: Build LevelDB
      run: |
        cd src/leveldb
        make libleveldb.a libmemenv.a

    - name: Run qmake
      run: |
        qmake microcoin-qt.pro OPENSSL_LIB_PATH=/usr/local/openssl-1.1/lib OPENSSL_INCLUDE_PATH=/usr/local/openssl-1.1/include

    - name: Build project
      run: |
        make -j$(nproc)

    - name: Upload Linux binary
      uses: actions/upload-artifact@v4
      with:
        name: microcoin-qt-linux
        path: microcoin-qt


  # ============================
  # WINDOWS BUILD (MXE CROSS-COMPILE)
  # ============================
  windows:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install MXE dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          make \
          automake \
          autoconf \
          libtool \
          g++ \
          pkg-config \
          git \
          wget \
          autopoint \
          gperf \
          intltool \
          lzip \
          python3-mako \
          gdk-pixbuf2.0-dev

    - name: Build MXE with OpenSSL 1.1
      run: |
        git clone https://github.com/mxe/mxe.git
        cd mxe
        make -j$(nproc) MXE_TARGETS=x86_64-w64-mingw32.static openssl

    - name: Build LevelDB (Windows)
      run: |
        cd src/leveldb
        make CC=x86_64-w64-mingw32.static-gcc CXX=x86_64-w64-mingw32.static-g++ libleveldb.a libmemenv.a

    - name: Run qmake (Windows)
      run: |
        /home/runner/work/MicroCoin/MicroCoin/mxe/usr/bin/x86_64-w64-mingw32.static-qmake microcoin-qt.pro

    - name: Build project (Windows)
      run: |
        make -j$(nproc)

    - name: Upload Windows binary
      uses: actions/upload-artifact@v4
      with:
        name: microcoin-qt-windows
        path: microcoin-qt.exe


  # ============================
  # MACOS BUILD (INTEL + ARM64 UNIVERSAL)
  # ============================
  macos:
    runs-on: macos-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install Qt 5
      uses: jurplel/install-qt-action@v3
      with:
        version: 5.15.2
        host: mac
        target: desktop
        modules: qtcharts

    - name: Install dependencies
      run: |
        brew update
        brew install protobuf qrencode miniupnpc curl

    - name: Install OpenSSL 1.1.1u (Intel)
      if: runner.arch == 'X64'
      run: |
        curl -O https://www.openssl.org/source/openssl-1.1.1u.tar.gz
        tar -xzf openssl-1.1.1u.tar.gz
        cd openssl-1.1.1u
        ./Configure darwin64-x86_64-cc no-shared --prefix=/usr/local/openssl-1.1-intel
        make -j$(sysctl -n hw.ncpu)
        sudo make install_sw

    - name: Install OpenSSL 1.1.1u (ARM64)
      if: runner.arch == 'ARM64'
      run: |
        curl -O https://www.openssl.org/source/openssl-1.1.1u.tar.gz
        tar -xzf openssl-1.1.1u.tar.gz
        cd openssl-1.1.1u
        ./Configure darwin64-arm64-cc no-shared --prefix=/usr/local/openssl-1.1-arm64
        make -j$(sysctl -n hw.ncpu)
        sudo make install_sw

    - name: Build LevelDB (macOS)
      run: |
        cd src/leveldb
        make libleveldb.a libmemenv.a

    - name: Run qmake (macOS)
      run: |
        if [ "$(uname -m)" = "x86_64" ]; then \
          OPENSSL_LIB_PATH=/usr/local/openssl-1.1-intel/lib; \
          OPENSSL_INCLUDE_PATH=/usr/local/openssl-1.1-intel/include; \
        else \
          OPENSSL_LIB_PATH=/usr/local/openssl-1.1-arm64/lib; \
          OPENSSL_INCLUDE_PATH=/usr/local/openssl-1.1-arm64/include; \
        fi; \
        qmake microcoin-qt.pro OPENSSL_LIB_PATH=$OPENSSL_LIB_PATH OPENSSL_INCLUDE_PATH=$OPENSSL_INCLUDE_PATH

    - name: Build project (macOS)
      run: |
        make -j$(sysctl -n hw.ncpu)

    - name: Upload macOS app
      uses: actions/upload-artifact@v4
      with:
        name: microcoin-qt-macos
        path: MicroCoin-Qt.app
