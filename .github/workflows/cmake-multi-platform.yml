name: Build Microcoin-Qt

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ============================
  # LINUX x86_64 BUILD
  # ============================
  linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install Qt 5
      uses: jurplel/install-qt-action@v3
      with:
        version: 5.15.2
        host: linux
        target: desktop
        modules: qtcharts

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          libdb++-dev \
          libboost-all-dev \
          libminiupnpc-dev \
          libqrencode-dev \
          libprotobuf-dev protobuf-compiler \
          libevent-dev \
          pkg-config \
          automake \
          libtool \
          git \
          wget

    - name: Install OpenSSL 1.1 manually
      run: |
        wget https://snapshot.debian.org/archive/debian-security/20230201T000000Z/pool/updates/main/o/openssl1.1/libssl1.1_1.1.1n-0+deb11u4_amd64.deb
        wget https://snapshot.debian.org/archive/debian-security/20230201T000000Z/pool/updates/main/o/openssl1.1/libssl-dev_1.1.1n-0+deb11u4_amd64.deb
        sudo dpkg -i libssl1.1_1.1.1n-0+deb11u4_amd64.deb
        sudo dpkg -i libssl-dev_1.1.1n-0+deb11u4_amd64.deb

    - name: Build LevelDB
      run: |
        cd src/leveldb
        make libleveldb.a libmemenv.a

    - name: Run qmake
      run: |
        qmake microcoin-qt.pro OPENSSL_LIB_PATH=/usr/lib OPENSSL_INCLUDE_PATH=/usr/include

    - name: Build project
      run: |
        make -j$(nproc)

    - name: Upload Linux binary
      uses: actions/upload-artifact@v4
      with:
        name: microcoin-qt-linux
        path: microcoin-qt


  # ============================
  # WINDOWS BUILD (MXE CROSS-COMPILE)
  # ============================
  windows:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install MXE manually
      run: |
        sudo apt update
        sudo apt install -y make automake autoconf libtool g++ pkg-config git wget
        git clone https://github.com/mxe/mxe.git
        cd mxe
        make -j$(nproc) MXE_TARGETS=x86_64-w64-mingw32.static openssl

    - name: Build LevelDB (Windows)
      run: |
        cd src/leveldb
        make CC=x86_64-w64-mingw32.static-gcc CXX=x86_64-w64-mingw32.static-g++ libleveldb.a libmemenv.a

    - name: Run qmake (Windows)
      run: |
        /usr/lib/mxe/usr/bin/x86_64-w64-mingw32.static-qmake microcoin-qt.pro

    - name: Build project (Windows)
      run: |
        make -j$(nproc)

    - name: Upload Windows binary
      uses: actions/upload-artifact@v4
      with:
        name: microcoin-qt-windows
        path: microcoin-qt.exe


  # ============================
  # MACOS BUILD (NATIVE)
  # ============================
  macos:
    runs-on: macos-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install Qt 5
      uses: jurplel/install-qt-action@v3
      with:
        version: 5.15.2
        host: mac
        target: desktop
        modules: qtcharts

    - name: Install OpenSSL 1.1 manually (archived bottle)
      run: |
        wget https://raw.githubusercontent.com/Homebrew/homebrew-core/6f3b1b4b0b8b1b2b9b7d3f9e7d8a1c9a1b2c3d4e/Formula/openssl@1.1.rb
        brew install ./openssl@1.1.rb

    - name: Install dependencies
      run: |
        brew install protobuf qrencode miniupnpc

    - name: Build LevelDB (macOS)
      run: |
        cd src/leveldb
        make libleveldb.a libmemenv.a

    - name: Run qmake (macOS)
      run: |
        qmake microcoin-qt.pro OPENSSL_LIB_PATH=/usr/local/opt/openssl@1.1/lib OPENSSL_INCLUDE_PATH=/usr/local/opt/openssl@1.1/include

    - name: Build project (macOS)
      run: |
        make -j$(sysctl -n hw.ncpu)

    - name: Upload macOS app
      uses: actions/upload-artifact@v4
      with:
        name: microcoin-qt-macos
        path: MicroCoin-Qt.app
