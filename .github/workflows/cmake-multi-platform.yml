name: Build Microcoin-Qt

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Enable OpenSSL 3 Legacy Provider
      run: |
        sudo sh -c "echo 'openssl_conf = openssl_init\n\n[openssl_init]\nproviders = provider_sect\n\n[provider_sect]\nlegacy = legacy_sect\n\n[legacy_sect]\nactivate = 1' | tr '\n' '\n' > /etc/ssl/legacy.cnf"
        export OPENSSL_CONF=/etc/ssl/legacy.cnf

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: 5.15.2
        host: linux
        target: desktop

    - name: Install deps
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential libdb++-dev libboost-all-dev \
          libminiupnpc-dev libqrencode-dev \
          libprotobuf-dev protobuf-compiler \
          libevent-dev pkg-config automake libtool git

    - name: Build LevelDB
      run: |
        cd src/leveldb
        make libleveldb.a libmemenv.a

    - name: qmake
      run: |
        export OPENSSL_CONF=/etc/ssl/legacy.cnf
        qmake microcoin-qt.pro

    - name: Build
      run: |
        export OPENSSL_CONF=/etc/ssl/legacy.cnf
        make -j$(nproc)

    - uses: actions/upload-artifact@v4
      with:
        name: microcoin-qt-linux
        path: microcoin-qt


  windows:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install MXE deps
      run: |
        sudo apt update
        sudo apt install -y \
          make automake autoconf libtool libtool-bin g++ pkg-config git wget \
          autopoint gperf intltool lzip python3-mako \
          libgdk-pixbuf-2.0-dev

    - name: Build MXE
      run: |
        git clone https://github.com/mxe/mxe.git
        cd mxe
        make -j$(nproc) MXE_TARGETS=x86_64-w64-mingw32.static qtbase

    - name: Build LevelDB
      run: |
        cd src/leveldb
        make CC=x86_64-w64-mingw32.static-gcc \
             CXX=x86_64-w64-mingw32.static-g++ \
             libleveldb.a libmemenv.a

    - name: qmake
      run: |
        echo 'openssl_conf = openssl_init\n\n[openssl_init]\nproviders = provider_sect\n\n[provider_sect]\nlegacy = legacy_sect\n\n[legacy_sect]\nactivate = 1' | tr '\n' '\n' > legacy.cnf
        export OPENSSL_CONF=$PWD/legacy.cnf
        /home/runner/work/MicroCoin/MicroCoin/mxe/usr/bin/x86_64-w64-mingw32.static-qmake microcoin-qt.pro

    - name: Build
      run: |
        export OPENSSL_CONF=$PWD/legacy.cnf
        make -j$(nproc)

    - uses: actions/upload-artifact@v4
      with:
        name: microcoin-qt-windows
        path: microcoin-qt.exe


  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Enable OpenSSL 3 Legacy Provider
      run: |
        echo 'openssl_conf = openssl_init\n\n[openssl_init]\nproviders = provider_sect\n\n[provider_sect]\nlegacy = legacy_sect\n\n[legacy_sect]\nactivate = 1' | tr '\n' '\n' > legacy.cnf
        export OPENSSL_CONF=$PWD/legacy.cnf

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: 5.15.2
        host: mac
        target: desktop

    - name: Install deps
      run: |
        brew update
        brew install openssl@3 protobuf qrencode miniupnpc

    - name: Build LevelDB
      run: |
        cd src/leveldb
        make libleveldb.a libmemenv.a

    - name: qmake
      run: |
        export OPENSSL_CONF=$PWD/legacy.cnf
        qmake microcoin-qt.pro

    - name: Build
      run: |
        export OPENSSL_CONF=$PWD/legacy.cnf
        make -j$(sysctl -n hw.ncpu)

    - uses: actions/upload-artifact@v4
      with:
        name: microcoin-qt-macos
        path: MicroCoin-Qt.app
